<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Stock</title>
<style>
  :root{
    --bar:#1C1C1E; --bar2:#2C2C2E; --line:rgba(255,255,255,.12);
    --text:#F2F2F7; --muted:#A1A1AA; --stock:#34C759; --cover:#0A84FF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bar);}
  body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Sarabun',sans-serif;color:var(--text);display:flex;flex-direction:column;}
  nav{display:flex;align-items:stretch;gap:8px;padding:8px 16px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;}
  .brand{display:flex;align-items:center;padding-right:10px;margin-right:4px;border-right:1px solid var(--line);font-weight:700;font-size:14px;letter-spacing:.3px;white-space:nowrap;color:#fff;}
  .tab{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
       display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 14px;border-radius:12px;
       font:inherit;text-align:left;white-space:nowrap;min-width:0;transition:background .15s,color .15s,border-color .15s;}
  .tab .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .tab .t i{width:9px;height:9px;border-radius:50%;display:inline-block;background:currentColor;opacity:.5}
  .tab .s{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .tab[aria-selected="true"]{background:var(--bar2);color:#fff;}
  .tab[data-k="stock"][aria-selected="true"]{border-color:var(--stock);}
  .tab[data-k="stock"] .t i{background:var(--stock);opacity:1}
  .tab[data-k="cover"][aria-selected="true"]{border-color:var(--cover);}
  .tab[data-k="cover"] .t i{background:var(--cover);opacity:1}
  .tab:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  main{flex:1;position:relative;min-height:0;background:#F2F2F7;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#F2F2F7;}
  iframe.on{display:block;}
  @media (max-width:560px){ .brand{display:none} .tab .pre{display:none} nav{padding:8px 12px} .tab{padding:6px 11px} .tab .t{font-size:13px} }
</style>
</head>
<body>
<nav role="tablist" aria-label="Auto Stock dashboards">
  <div class="brand">Auto Stock</div>
  <button class="tab" role="tab" data-k="stock" id="tab-stock" aria-controls="f-stock" aria-selected="true">
    <span class="t"><i></i>Stock คงเหลือรายสาขา</span>
    <span class="s"><span class="pre">Data As of </span><span id="s-stock">กำลังโหลด…</span></span>
  </button>
  <button class="tab" role="tab" data-k="cover" id="tab-cover" aria-controls="f-cover" aria-selected="false">
    <span class="t"><i></i>Stock Cover Week</span>
    <span class="s"><span class="pre">Data As of </span><span id="s-cover">กำลังโหลด…</span></span>
  </button>
</nav>
<main>
  <iframe id="f-stock" class="on" title="Stock คงเหลือรายสาขา" src="stock/"></iframe>
  <iframe id="f-cover" title="Stock Cover Week" data-src="stock-cover-week/"></iframe>
</main>
<script>
(function(){
  var KEYS = {stock:'stock', cover:'cover-week'};
  var frames = {stock:document.getElementById('f-stock'), cover:document.getElementById('f-cover')};
  var tabs = {stock:document.getElementById('tab-stock'), cover:document.getElementById('tab-cover')};
  function load(k){ var f = frames[k]; if(!f.getAttribute('src') && f.dataset.src) f.setAttribute('src', f.dataset.src); }
  function show(k, push){
    Object.keys(frames).forEach(function(x){
      frames[x].classList.toggle('on', x===k);
      tabs[x].setAttribute('aria-selected', x===k ? 'true' : 'false');
    });
    load(k);
    document.title = (k==='cover' ? 'Stock Cover Week' : 'Stock คงเหลือรายสาขา') + ' · Auto Stock';
    if(push){ try{ history.replaceState(null,'','#'+KEYS[k]); }catch(e){} }
  }
  // "Data As of + time" of each page, read from the page itself (same site)
  function stamp(k, idDate, idTime){
    try{
      var d = frames[k].contentDocument;
      var a = d && d.getElementById(idDate), t = d && d.getElementById(idTime);
      if(a && a.textContent.trim()) document.getElementById('s-'+k).textContent =
        a.textContent.trim() + (t && t.textContent.trim() ? ' · ' + t.textContent.trim() + ' น.' : '');
    }catch(e){}
  }
  frames.stock.addEventListener('load', function(){ stamp('stock','data-as-of','data-time'); setTimeout(function(){ stamp('stock','data-as-of','data-time'); }, 1500); load('cover'); });
  frames.cover.addEventListener('load', function(){ stamp('cover','scwDataAsOf','scwDataTime'); setTimeout(function(){ stamp('cover','scwDataAsOf','scwDataTime'); }, 1500); });
  tabs.stock.addEventListener('click', function(){ show('stock', true); });
  tabs.cover.addEventListener('click', function(){ show('cover', true); });
  var h = (location.hash||'').replace('#','');
  show(h==='cover-week' || h==='cover' ? 'cover' : 'stock', false);
})();
</script>
</body>
</html>
